name: Bug report
description: Report a reproducible localtime-audit problem
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal synthetic input
      description: Remove secrets, personal paths and private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and tool version
    validations:
      required: true
